<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLIPON 2024 — Lomba Poster Infografis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080810;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Top bar style similar to motion graphics */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; align-items: center; justify-content: center;
            padding: 14px 24px;
            background: rgba(8, 8, 16, 0.75); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 100;
        }
        .close-btn {
            position: absolute; left: 24px; color: #c0b8ff; text-decoration: none;
            background: rgba(124,110,245,0.15); padding: 7px 16px; border-radius: 8px;
            font-size: 13px; border: 1px solid rgba(124,110,245,0.3);
            transition: all 0.3s; display: flex; align-items: center; gap: 6px;
        }
        .close-btn:hover { background: rgba(124,110,245,0.35); border-color: rgba(124,110,245,0.7); }
        .top-bar .title {
            font-size: 15px; font-weight: 600;
            background: linear-gradient(135deg, #a78bfa, #7c6ef5, #c4b5fd);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero { padding: 90px 0 30px; display: flex; flex-direction: column; align-items: center; }
        .hero-title { font-size: clamp(24px, 4vw, 38px); font-weight: 700; text-align: center; margin-bottom: 10px; }
        .hero-title span { background: linear-gradient(135deg, #a78bfa, #7c6ef5); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-desc { font-size: 14px; color: rgba(255,255,255,0.5); text-align: center; max-width: 520px; line-height: 1.7; padding: 0 20px; margin-bottom: 30px; }

        /* Slider */
        .slider-container {
            position: relative; width: 100%; max-width: 960px; margin: 0 auto 50px;
            padding: 0 20px;
        }
        .slider {
            position: relative; width: 100%; border-radius: 14px; overflow: hidden;
            border: 1px solid rgba(124,110,245,0.3); background: #0d0d18;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7); aspect-ratio: 16/9;
            display: flex; align-items: center; justify-content: center;
        }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.5s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .slide img {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        .prev, .next {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(8, 8, 16, 0.7); color: #fff; border: 1px solid rgba(124,110,245,0.5);
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 24px; z-index: 10; transition: all 0.3s;
        }
        .prev:hover, .next:hover { background: rgba(124,110,245,0.8); }
        .prev { left: 30px; }
        .next { right: 30px; }

        .thumbnails {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;
            padding: 0 20px;
        }
        .thumb {
            width: 80px; height: 60px; border-radius: 8px; cursor: pointer;
            border: 2px solid transparent; overflow: hidden; opacity: 0.6; transition: all 0.3s;
        }
        .thumb.active, .thumb:hover { opacity: 1; border-color: #a78bfa; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* Ambient BG */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.12; pointer-events: none; z-index: -1; }
        .orb1 { width: 400px; height: 400px; background: #7c6ef5; top: -100px; right: -80px; }
        .orb2 { width: 300px; height: 300px; background: #a855f7; bottom: 100px; left: -80px; }
    </style>
</head>
<body>
    <div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>

    <div class="top-bar">
        <a href="javascript:void(0);" onclick="window.close();" class="close-btn"><i class="bx bx-arrow-back"></i> Close</a>
        <span class="title">Desain Grafis & Poster</span>
    </div>

    <div class="hero">
        <h1 class="hero-title">Desain Grafis & <span>Poster</span></h1>
        <p class="hero-desc">Kumpulan karya desain grafis meliputi poster, flyer, dan konten visual kreatif dengan pendekatan estetika modern.</p>
    </div>

    <h2 id="slide-title" style="text-align:center; font-size: 20px; font-weight:600; margin-bottom: 20px; color: #a78bfa;">GLIPON 2024 — Lomba Poster Infografis</h2>
    <div class="slider-container">
        <div class="slider" id="slider">
            <div class="slide active"><img src="asets/Poster-dan-desain-grafis/lomba-poster.jpeg" alt="Lomba Poster"></div>
            <div class="slide"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.14.jpeg" alt="Desain 1"></div>
            <div class="slide"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.16.jpeg" alt="Desain 2"></div>
            <div class="slide"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.16 (1).jpeg" alt="Desain 3"></div>
            <div class="slide"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.16 (2).jpeg" alt="Desain 4"></div>
            <div class="slide"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.17.jpeg" alt="Desain 5"></div>
            <div class="prev" onclick="changeSlide(-1)"><i class="bx bx-chevron-left"></i></div>
            <div class="next" onclick="changeSlide(1)"><i class="bx bx-chevron-right"></i></div>
        </div>
        <div class="thumbnails" id="thumbnails">
            <div class="thumb active" onclick="goToSlide(0)"><img src="asets/Poster-dan-desain-grafis/lomba-poster.jpeg" alt="Thumb 0"></div>
            <div class="thumb" onclick="goToSlide(1)"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.14.jpeg" alt="Thumb 1"></div>
            <div class="thumb" onclick="goToSlide(2)"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.16.jpeg" alt="Thumb 2"></div>
            <div class="thumb" onclick="goToSlide(3)"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.16 (1).jpeg" alt="Thumb 3"></div>
            <div class="thumb" onclick="goToSlide(4)"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.16 (2).jpeg" alt="Thumb 4"></div>
            <div class="thumb" onclick="goToSlide(5)"><img src="asets/Poster-dan-desain-grafis/WhatsApp Image 2026-08-05 at 08.31.17.jpeg" alt="Thumb 5"></div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const thumbs = document.querySelectorAll('.thumb');
        const slideTitle = document.getElementById('slide-title');
        
        const titles = [
            "GLIPON 2024 — Lomba Poster Infografis",
            "Poster",
            "Desain Grafis",
            "Desain Grafis",
            "Desain Grafis",
            "Desain Grafis"
        ];
        
        function updateSlider() {
            slides.forEach((slide, index) => {
                if (index === currentSlide) slide.classList.add('active');
                else slide.classList.remove('active');
            });
            thumbs.forEach((thumb, index) => {
                if (index === currentSlide) thumb.classList.add('active');
                else thumb.classList.remove('active');
            });
            slideTitle.innerText = titles[currentSlide];
        }
        
        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= slides.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = slides.length - 1;
            updateSlider();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlider();
        }
    </script>
</body>
</html>
