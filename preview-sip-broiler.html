<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - Sistem Informasi Pengelolaan Ayam Broiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .slider-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider-container img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s;
        }
        .slider-container img.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 24px;
            border-radius: 50%;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.5);
        }
        .prev-btn { left: -60px; }
        .next-btn { right: -60px; }
        
        @media (max-width: 768px) {
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }
        
        .indicator {
            margin-top: 20px;
            font-size: 16px;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.4);
        }
        .title {
            position: absolute;
            top: 20px;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <a href="#" onclick="window.close();" class="back-link">← Close Preview</a>
    
    <div class="title" id="image-title">Dashboard</div>

    <div class="slider-container">
        <button class="nav-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
        
        <img src="asets/Dashboard-SIP-Boiler.jpeg" class="slide active" alt="Dashboard">
        <img src="asets/Populasi-Ayam-Boiler.jpeg" class="slide" alt="Populasi Ayam">
        <img src="asets/Stok-dan-pakan-penggunaan.jpeg" class="slide" alt="Stok dan Pakan">
        <img src="asets/Laporan-dan-Panen.jpeg" class="slide" alt="Laporan dan Panen">

        <button class="nav-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <div class="indicator" id="indicator">1 / 4</div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const indicator = document.getElementById('indicator');
        const title = document.getElementById('image-title');
        
        const titles = [
            "Dashboard",
            "Populasi Ayam",
            "Stok & Pakan",
            "Laporan & Panen"
        ];

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide += direction;
            
            if (currentSlide >= slides.length) {
                currentSlide = 0;
            } else if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }
            
            slides[currentSlide].classList.add('active');
            indicator.innerText = (currentSlide + 1) + " / " + slides.length;
            title.innerText = titles[currentSlide];
        }
    </script>
</body>
</html>
