<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Video Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080810;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            background: rgba(8, 8, 16, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            z-index: 100;
        }
        .top-bar .title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e0e0e0;
        }
        .close-btn {
            position: absolute;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.3s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.35); }
        .indicator-top {
            position: absolute;
            right: 20px;
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 60px 80px 90px;
        }

        .slide {
            display: none;
            width: 100%;
            max-height: calc(100vh - 150px);
            border-radius: 10px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7);
            animation: fadeIn 0.4s ease;
        }
        .slide.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(8, 8, 16, 0.7);
            color: #fff;
            border: 1px solid rgba(124,110,245,0.5);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .nav-btn:hover { background: rgba(124,110,245,0.8); border-color: rgba(124,110,245,0.9); }
        .prev-btn { left: 16px; }
        .next-btn { right: 16px; }

        /* Thumbnail strip */
        .thumbs {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            overflow-x: auto;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            justify-content: center;
            scrollbar-width: none;
        }
        .thumbs::-webkit-scrollbar { display: none; }
        .thumb-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .thumb-icon {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .thumb-item.active .thumb-icon {
            background: rgba(124, 110, 245, 0.3);
            border-color: #7c6ef5;
        }
        .thumb-item:hover .thumb-icon {
            background: rgba(255,255,255,0.2);
        }
        .thumb-label {
            font-size: 11px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .thumb-item.active .thumb-label { opacity: 1; }

        /* Ambient BG */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.12; pointer-events: none; z-index: -1; }
        .orb1 { width: 400px; height: 400px; background: #7c6ef5; top: -100px; right: -80px; }
        .orb2 { width: 300px; height: 300px; background: #a855f7; bottom: 100px; left: -80px; }
    </style>
</head>
<body>
    <div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
    <div class="top-bar">
        <a href="#" onclick="window.close();" class="close-btn">← Close</a>
        <span class="title" id="slide-title">Cinematic Video 1</span>
        <span class="indicator-top" id="indicator">1 / 4</span>
    </div>

    <div class="slider-wrapper">
        <button class="nav-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>

        <video class="slide active" controls>
            <source src="asets/Cienematik/cinematic.mp4" type="video/mp4">
        </video>
        <video class="slide" controls>
            <source src="asets/Cienematik/Cinematik_2.mp4" type="video/mp4">
        </video>
        <video class="slide" controls>
            <source src="asets/Cienematik/Cinematik_3.mp4" type="video/mp4">
        </video>
        <video class="slide" controls>
            <source src="asets/Cienematik/Cinematik_4.mp4" type="video/mp4">
        </video>

        <button class="nav-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <div class="thumbs" id="thumbStrip">
        <div class="thumb-item active" onclick="goTo(0)">
            <div class="thumb-icon">🎬</div>
            <span class="thumb-label">Video 1</span>
        </div>
        <div class="thumb-item" onclick="goTo(1)">
            <div class="thumb-icon">🎬</div>
            <span class="thumb-label">Video 2</span>
        </div>
        <div class="thumb-item" onclick="goTo(2)">
            <div class="thumb-icon">🎬</div>
            <span class="thumb-label">Video 3</span>
        </div>
        <div class="thumb-item" onclick="goTo(3)">
            <div class="thumb-icon">🎬</div>
            <span class="thumb-label">Video 4</span>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const thumbItems = document.querySelectorAll('.thumb-item');
        const indicator = document.getElementById('indicator');
        const titleEl = document.getElementById('slide-title');
        const total = slides.length;
        const titles = ['Cinematic Video 1', 'Cinematic Video 2', 'Cinematic Video 3', 'Cinematic Video 4'];

        function goTo(index) {
            // Pause current video
            if (slides[currentSlide].tagName === 'VIDEO') {
                slides[currentSlide].pause();
            }

            slides[currentSlide].classList.remove('active');
            thumbItems[currentSlide].classList.remove('active');

            currentSlide = (index + total) % total;

            slides[currentSlide].classList.add('active');
            thumbItems[currentSlide].classList.add('active');
            indicator.innerText = (currentSlide + 1) + ' / ' + total;
            titleEl.innerText = titles[currentSlide];
        }

        function changeSlide(dir) { goTo(currentSlide + dir); }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === 'ArrowLeft') changeSlide(-1);
        });
    </script>
</body>
</html>
